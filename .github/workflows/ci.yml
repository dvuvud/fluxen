name: CI
on:
  push:
    branches: ["main"]
    paths: &watched_paths
      - "fluxen.hpp"
      - "tests/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths: *watched_paths

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang-tidy-15
      - run: clang-tidy-15 fluxen.hpp -- -std=c++20

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc-13 (Linux)
            os: ubuntu-24.04
            cxx: g++-13
          - name: clang-15 (Linux)
            os: ubuntu-24.04
            cxx: clang++-15
            flags: -stdlib=libc++
          - name: MSVC (Windows)
            os: windows-2022
            cxx: cl
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build clang-15 libc++-15-dev libc++abi-15-dev
      - run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DFLUXEN_BUILD_BENCHMARKS=OFF
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
      - run: cmake --build build --config Release
      - run: ctest --test-dir build --output-on-failure
